name: flutter_sprite_stack_example
description: Interactive demo for the flutter_sprite_stack package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  bonfire: ^4.2.0
  flutter:
    sdk: flutter
  flutter_sprite_stack:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/robot_stack.png
    - sprites/car/slices.png
    - sprites/house/slices.png
    - sprites/tree/slices.png
    - sprites/torch/frames.png
