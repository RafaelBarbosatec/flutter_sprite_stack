name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Lint agent skills
        run: dart run skills_lint

      - name: Render scene previews
        run: SCENE_PREVIEW=1 flutter test test/scene_preview_test.dart

      - name: Upload scene previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-previews
          path: build/scene_previews/*.png
          if-no-files-found: ignore

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release
